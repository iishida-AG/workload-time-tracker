<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>業務管理ツール</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260817-hide-minute-input-v1" />
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <section class="panel">Loading...</section>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div class="app-shell"><section class="panel"><strong>App failed to start</strong><p>' +
          String(event.message || 'JavaScript error') +
          '</p></section></div>';
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || !/Loading/.test(root.innerText || '')) return;
        root.innerHTML =
          '<div class="app-shell"><section class="panel"><strong>Still loading</strong><p>Please reload the page. If this continues, the browser may still have an old cache.</p></section></div>';
      }, 12000);
    </script>
    <script type="module" src="./src/main.js?v=20260817-hide-minute-input-v1"></script>
  </body>
</html>
